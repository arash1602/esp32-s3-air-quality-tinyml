; Sensa firmware (dev-board build) with and without the hourly WHO-exceedance warning,
; for the paper's full-firmware cost: flash and RAM (build size report), heap and stack
; at run time (USB console), and current (Nordic PPK2).
;
;   sensa-base   the Sensa firmware as the team runs it on the dev board (LED off)
;   sensa-aq     the same with the hourly warning (8-bit TCN, 24-h horizon); the
;                library's working memory sized for this model (64 channels, kernel 2,
;                3 blocks), as a firmware that ships one TCN would build it
;   sensa-aq-generic  the same with the library's default limits (any of the six
;                families up to the benchmark's largest), for comparison
;   sensa-ppk2   sensa-aq with 1-minute "hours" and a pre-filled 24-hour window, so a
;                prediction runs every minute during a power recording
;
; SEN55 on I2C: SDA = GPIO8, SCL = GPIO9 (as in the Sensa firmware).

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
monitor_speed = 115200
build_unflags = -std=gnu++11
lib_deps = sensirion/Sensirion I2C SEN5X @ ^0.3.0
; library: no staging buffer (a TCN does not use it); see aq_infer.h
build_flags = -std=gnu++17 -Iinclude -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM=0 -D AQ_STAGE_BYTES=0

[env:sensa-base]

[env:sensa-aq]
build_flags = ${env.build_flags} -D AQ_ENABLE -D AQ_MAX_CH=64 -D AQ_MAX_K=2 -D AQ_MAX_LAYERS=3

[env:sensa-aq-generic]
build_flags = ${env.build_flags} -D AQ_ENABLE

[env:sensa-ppk2]
build_flags = ${env.build_flags} -D AQ_ENABLE -D AQ_MAX_CH=64 -D AQ_MAX_K=2 -D AQ_MAX_LAYERS=3
  -D AQ_HOUR_S=60 -D AQ_PREFILL

; sensa-ppk2 built with -O2 instead of the Arduino default -Os, as the benchmark firmware
; was: separates the compiler setting from the effect of the running application
[env:sensa-ppk2-o2]
build_unflags = -std=gnu++11 -Os
build_flags = ${env:sensa-ppk2.build_flags} -O2

; 24-hour end-to-end run: real hours, real SEN55 readings from the first second, -O2;
; every classified window is printed so the PC can re-run it (analysis/sensa_24h_check.py)
[env:sensa-24h]
build_unflags = -std=gnu++11 -Os
build_flags = ${env.build_flags} -O2 -D AQ_ENABLE -D AQ_MAX_CH=64 -D AQ_MAX_K=2 -D AQ_MAX_LAYERS=3
  -D AQ_PRINT_WINDOW -D AQ_MEM_PRINT_S=600
