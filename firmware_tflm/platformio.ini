; TensorFlow Lite Micro on the ESP32-S3, for the comparison with aq_infer (same board,
; same model partition at 0x110000, same USB protocol as tools/hil.py, same PPK2 marker
; sequence as bench/aq_autorun.c). Models: tools/tflm_convert.py -> tflm_models.bin.
;
;   pio run -e tflm -t upload          USB protocol (tools/tflm_hil.py)
;   pio run -e tflm-ppk2 -t upload     stand-alone energy run (tools/ppk2_log.py)

[env:tflm]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = dio
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
monitor_speed = 115200

[env:tflm-ppk2]
extends = env:tflm
build_flags = -D TFLM_AUTORUN
