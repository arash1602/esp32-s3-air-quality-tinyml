; aq_bench: on-device benchmark of the WHO-threshold classifiers on the Sensa board.
; Same PlatformIO platform, framework and board definition as the Sensa firmware.
;
;   pio run -e sensa-8mb -t upload        (board with 8 MB flash, e.g. ESP32-S3-WROOM-1-N8)
;   pio run -e sensa-4mb -t upload        (4 MB flash, e.g. -N4)
;   pio run -e sensa-16mb -t upload       (16 MB flash, e.g. -N16; uses the 8 MB layout)
;
; Then write the model image to 0x110000 (BOARD_GUIDE.md, step 2).

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
monitor_speed = 115200
; Speed-optimized build for the benchmark (the Arduino default is -Os). The paper
; reports both: build once more without the build_unflags line and the -O2 flag.
build_unflags = -Os
build_flags = -O2 -I$PROJECT_DIR/../c -I$PROJECT_DIR/../bench
  -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1 -D BOARD_HAS_PSRAM=0

[env:sensa-8mb]
board_upload.flash_size = 8MB
board_upload.maximum_size = 1048576
board_build.partitions = partitions_8MB.csv

[env:sensa-4mb]
board_upload.flash_size = 4MB
board_upload.maximum_size = 1048576
board_build.partitions = partitions_4MB.csv

[env:sensa-16mb]
board_upload.flash_size = 16MB
board_upload.maximum_size = 1048576
board_build.partitions = partitions_8MB.csv

; Stand-alone energy run for the Nordic PPK2 (bench/aq_autorun.c): the board runs every
; model in the model image by itself and marks each prediction on GPIO4.
[env:ppk2]
extends = env:sensa-8mb
build_flags = ${env.build_flags} -D AQ_AUTORUN
